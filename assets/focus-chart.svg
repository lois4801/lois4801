    <g opacity="0"><rect x="268" y="121" width="10" height="10" rx="3" fill="#ff9f0a"/><text x="288" y="130" fill="#d1d1d6">Data Analytics and BI</text><text x="540" y="130" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6e6e73">12 · <tspan fill="#ff9f0a">26%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="155" width="10" height="10" rx="3" fill="#64d2ff"/><text x="288" y="164" fill="#d1d1d6">Machine Learning and DS</text><text x="540" y="164" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6e6e73">11 · <tspan fill="#64d2ff">24%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.88s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="189" width="10" height="10" rx="3" fill="#30d158"/><text x="288" y="198" fill="#d1d1d6">AI Platforms and Agents</text><text x="540" y="198" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6e6e73">8 · <tspan fill="#30d158">17%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.06s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="223" width="10" height="10" rx="3" fill="#bf5af2"/><text x="288" y="232" fill="#d1d1d6">Learning and Resources</text><text x="540" y="232" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6e6e73">9 · <tspan fill="#bf5af2">20%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.24s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="257" width="10" height="10" rx="3" fill="#ff375f"/><text x="288" y="266" fill="#d1d1d6">Industry and Safety</text><text x="540" y="266" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6e6e73">6 · <tspan fill="#ff375f">13%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.42s" fill="freeze"/></g>
  </g>

  <!-- divider -->
  <line x1="576" y1="86" x2="576" y2="292" stroke="#2c2c2e"/>

  <!-- bars: repos created per year -->
  <text x="735" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#6e6e73">REPOS CREATED PER YEAR</text>
  <line x1="600" y1="272" x2="870" y2="272" stroke="#2c2c2e"/>

  <rect x="600" y="270" width="30" height="2" rx="1" fill="#2c2c2e"/>
  <rect x="648" y="270" width="30" height="2" rx="1" fill="#2c2c2e"/>
  <rect x="696" y="272" width="30" height="0" rx="6" fill="url(#barMulti)">
    <animate attributeName="height" from="0" to="140" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="132" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>
  <rect x="744" y="272" width="30" height="0" rx="4" fill="url(#barMulti)">
    <animate attributeName="height" from="0" to="8" dur="0.8s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="264" dur="0.8s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>
  <rect x="792" y="270" width="30" height="2" rx="1" fill="#2c2c2e"/>
  <rect x="840" y="272" width="30" height="0" rx="5" fill="url(#barMulti)">
    <animate attributeName="height" from="0" to="31" dur="0.9s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="241" dur="0.9s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- bar values -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#f5f5f7" text-anchor="middle">
    <text x="615" y="262" fill="#48484a">0</text>
    <text x="663" y="262" fill="#48484a">0</text>
    <text x="711" y="126" opacity="0">36<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/></text>
    <text x="759" y="256" opacity="0">2<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/></text>
    <text x="807" y="262" fill="#48484a">0</text>
    <text x="855" y="233" opacity="0">8<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/></text>
  </g>
  <!-- breakout annotation -->
  <g opacity="0">
    <text x="711" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" letter-spacing="1.5" fill="#ff9f0a">BREAKOUT YEAR</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/>
  </g>
  <!-- year labels -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#6e6e73" text-anchor="middle">
    <text x="615" y="292">2021</text>
    <text x="663" y="292">2022</text>
    <text x="711" y="292">2023</text>
    <text x="759" y="292">2024</text>
    <text x="807" y="292">2025</text>
    <text x="855" y="292">2026</text>
  </g>
