<svg xmlns="http://www.w3.org/2000/svg" width="896" height="320" viewBox="0 0 896 320" font-family="'-apple-system','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="barMulti" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
  </defs>

  <rect width="896" height="320" fill="#000000"/>
  <rect x="0.5" y="0.5" width="895" height="319" fill="none" stroke="#2c2c2e"/>

  <!-- header -->
  <rect x="40" y="30" width="9" height="9" fill="#ff375f"/>
  <text x="58" y="39" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="5" fill="#f5f5f7">REPOSITORY DNA — FOCUS AREAS and SHIPPING CADENCE</text>
  <circle cx="820" cy="35" r="3.5" fill="#30d158">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="856" y="39" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="3" fill="#30d158">LIVE SCAN</text>

  <!-- donut: focus areas -->
  <text x="140" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#6e6e73">FOCUS AREAS · N=46</text>
  <g transform="rotate(-90 140 195)">
    <circle cx="140" cy="195" r="47" fill="none" stroke="#ff9f0a" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="0">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="77.04 295.31" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#64d2ff" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-77.04">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="70.62 295.31" dur="1s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#30d158" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-147.66">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="51.36 295.31" dur="1s" begin="0.66s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#bf5af2" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-199.02">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="57.78 295.31" dur="1s" begin="0.84s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#ff375f" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-256.80">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="38.52 295.31" dur="1s" begin="1.02s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
  </g>
  <text x="140" y="201" text-anchor="middle" font-size="30" font-weight="700" fill="#f5f5f7">46</text>
  <text x="140" y="219" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="7.5" letter-spacing="1.5" fill="#6e6e73">INDEXED REPOS</text>

