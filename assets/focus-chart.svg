<svg xmlns="http://www.w3.org/2000/svg" width="896" height="320" viewBox="0 0 896 320" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="barGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffca34" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffca34"/>
    </linearGradient>
  </defs>

  <rect width="896" height="320" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="895" height="319" fill="none" stroke="#242424"/>

  <!-- header -->
  <rect x="40" y="30" width="9" height="9" fill="#ffca34"/>
  <text x="58" y="39" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="5" fill="#ffca34">REPOSITORY DNA — FOCUS AREAS and SHIPPING CADENCE</text>
  <circle cx="820" cy="35" r="3.5" fill="#7feb00">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="856" y="39" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="3" fill="#7feb00">LIVE SCAN</text>

  <!-- donut: focus areas -->
  <text x="140" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#777777">FOCUS AREAS · N=46</text>
  <g transform="rotate(-90 140 195)">
    <circle cx="140" cy="195" r="47" fill="none" stroke="#ffca34" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="0">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="77.04 295.31" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#00d5e9" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-77.04">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="70.62 295.31" dur="1s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#7feb00" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-147.66">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="51.36 295.31" dur="1s" begin="0.66s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#ff5872" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-199.02">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="57.78 295.31" dur="1s" begin="0.84s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
    <circle cx="140" cy="195" r="47" fill="none" stroke="#8a8a8a" stroke-width="26" stroke-dasharray="0 295.31" stroke-dashoffset="-256.80">
      <animate attributeName="stroke-dasharray" from="0 295.31" to="38.52 295.31" dur="1s" begin="1.02s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </circle>
  </g>
  <text x="140" y="201" text-anchor="middle" font-size="30" font-weight="700" fill="#f2f2f2">46</text>
  <text x="140" y="219" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="7.5" letter-spacing="1.5" fill="#777777">INDEXED REPOS</text>

  <!-- legend -->
  <g font-size="12.5">
    <g opacity="0"><rect x="268" y="121" width="10" height="10" fill="#ffca34"/><text x="288" y="130" fill="#c9c9c9">Data Analytics and BI</text><text x="540" y="130" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#777777">12 · <tspan fill="#ffca34">26%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="155" width="10" height="10" fill="#00d5e9"/><text x="288" y="164" fill="#c9c9c9">Machine Learning and DS</text><text x="540" y="164" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#777777">11 · <tspan fill="#00d5e9">24%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.88s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="189" width="10" height="10" fill="#7feb00"/><text x="288" y="198" fill="#c9c9c9">AI Platforms and Agents</text><text x="540" y="198" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#777777">8 · <tspan fill="#7feb00">17%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.06s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="223" width="10" height="10" fill="#ff5872"/><text x="288" y="232" fill="#c9c9c9">Learning and Resources</text><text x="540" y="232" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#777777">9 · <tspan fill="#ff5872">20%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.24s" fill="freeze"/></g>
    <g opacity="0"><rect x="268" y="257" width="10" height="10" fill="#8a8a8a"/><text x="288" y="266" fill="#c9c9c9">Industry and Safety</text><text x="540" y="266" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#777777">6 · <tspan fill="#c9c9c9">13%</tspan></text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.42s" fill="freeze"/></g>
  </g>

  <!-- divider -->
  <line x1="576" y1="86" x2="576" y2="292" stroke="#242424"/>

  <!-- bars: repos created per year -->
  <text x="735" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#777777">REPOS CREATED PER YEAR</text>
  <line x1="600" y1="272" x2="870" y2="272" stroke="#242424"/>

  <rect x="600" y="270" width="30" height="2" fill="#2a2a2a"/>
  <rect x="648" y="270" width="30" height="2" fill="#2a2a2a"/>
  <rect x="696" y="272" width="30" height="0" fill="url(#barGold)">
    <animate attributeName="height" from="0" to="140" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="132" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>
  <rect x="744" y="272" width="30" height="0" fill="url(#barGold)">
    <animate attributeName="height" from="0" to="8" dur="0.8s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="264" dur="0.8s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>
  <rect x="792" y="270" width="30" height="2" fill="#2a2a2a"/>
  <rect x="840" y="272" width="30" height="0" fill="url(#barGold)">
    <animate attributeName="height" from="0" to="31" dur="0.9s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="y" from="272" to="241" dur="0.9s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- bar values -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" fill="#f2f2f2" text-anchor="middle">
    <text x="615" y="262" fill="#5a5a5a">0</text>
    <text x="663" y="262" fill="#5a5a5a">0</text>
    <text x="711" y="126" opacity="0">36<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/></text>
    <text x="759" y="256" opacity="0">2<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/></text>
    <text x="807" y="262" fill="#5a5a5a">0</text>
    <text x="855" y="233" opacity="0">8<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/></text>
  </g>
  <!-- breakout annotation -->
  <g opacity="0">
    <text x="711" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" letter-spacing="1.5" fill="#ffca34">BREAKOUT YEAR</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/>
  </g>
  <!-- year labels -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#5a5a5a" text-anchor="middle">
    <text x="615" y="292">2021</text>
    <text x="663" y="292">2022</text>
    <text x="711" y="292">2023</text>
    <text x="759" y="292">2024</text>
    <text x="807" y="292">2025</text>
    <text x="855" y="292">2026</text>
  </g>
</svg>
