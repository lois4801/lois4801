<svg xmlns="http://www.w3.org/2000/svg" width="896" height="240" viewBox="0 0 896 240" font-family="'-apple-system','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="0.33" stop-color="#ff9f0a"/>
      <stop offset="0.66" stop-color="#30d158"/>
      <stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="burst" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="orbClip">
      <circle cx="744" cy="120" r="86"/>
    </clipPath>
  </defs>

  <rect width="896" height="240" fill="#000000"/>

  <!-- ambient glows -->
  <circle cx="744" cy="120" r="180" fill="url(#glowPink)">
    <animate attributeName="r" values="180;200;180" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="692" cy="152" r="140" fill="url(#glowCyan)">
    <animate attributeName="r" values="140;124;140" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <!-- color-burst orb -->
  <g clip-path="url(#orbClip)">
    <g filter="url(#burst)">
      <g filter="url(#softBlur)">
        <animateTransform attributeName="transform" type="rotate" from="0 744 120" to="360 744 120" dur="26s" repeatCount="indefinite"/>
        <circle cx="744" cy="66" r="52" fill="#ff375f"/>
        <circle cx="806" cy="102" r="48" fill="#ff9f0a"/>
        <circle cx="788" cy="172" r="50" fill="#30d158"/>
        <circle cx="700" cy="176" r="48" fill="#64d2ff"/>
        <circle cx="678" cy="104" r="50" fill="#bf5af2"/>
        <circle cx="744" cy="120" r="34" fill="#000000" opacity="0.85"/>
      </g>
    </g>
  </g>
  <circle cx="744" cy="120" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- satellite dots -->
  <g>
    <circle cx="648" cy="58" r="2.2" fill="#ff9f0a">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="852" cy="70" r="1.8" fill="#64d2ff">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="868" cy="176" r="2.4" fill="#ff375f">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="636" cy="182" r="1.6" fill="#bf5af2">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- kicker -->
  <circle cx="48" cy="53" r="3.5" fill="#30d158">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="58" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="5" fill="#a1a1a6">GITHUB OVERVIEW — LIVE</text>

  <!-- name: solid white + gradient -->
  <text x="44" y="122" font-size="48" font-weight="700" letter-spacing="-0.5" fill="#f5f5f7" opacity="0">ARTEMIS JAY
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="44" y="172" font-size="48" font-weight="700" letter-spacing="-0.5" fill="url(#nameGrad)" opacity="0">BERNABE
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.55s" fill="freeze"/>
  </text>

  <!-- tagline -->
  <text x="46" y="206" font-size="13.5" fill="#a1a1a6" opacity="0">SQL and BI dashboards  →  machine learning  →  agentic AI operating systems
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- one-line multicolor stats -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.7s" fill="freeze"/>
    <text x="46" y="228" fill="#6e6e73"><tspan fill="#ff375f" font-weight="700">100</tspan> REPOS   <tspan fill="#ff9f0a" font-weight="700">89</tspan> PUBLIC   <tspan fill="#30d158" font-weight="700">500+</tspan> CONTRIBUTIONS/12MO   <tspan fill="#64d2ff" font-weight="700">20</tspan> STARS   <tspan fill="#bf5af2" font-weight="700">05</tspan> YEARS</text>
  </g>
</svg>
