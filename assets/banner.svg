<svg xmlns="http://www.w3.org/2000/svg" width="896" height="240" viewBox="0 0 896 240" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffca34" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffca34" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffca34" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffca34"/>
      <stop offset="1" stop-color="#ffca34" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1e1e1e"/>
    </pattern>
  </defs>

  <rect width="896" height="240" fill="#0a0a0a"/>
  <rect width="896" height="240" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="895" height="239" fill="none" stroke="#242424"/>

  <!-- scanning sweep -->
  <rect x="-90" y="0" width="90" height="240" fill="url(#scan)">
    <animate attributeName="x" from="-90" to="896" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting particles -->
  <g fill="#ffca34">
    <circle cx="680" cy="56" r="2.4">
      <animate attributeName="cy" values="56;42;56" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="742" cy="120" r="1.7">
      <animate attributeName="cy" values="120;136;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="618" cy="150" r="2">
      <animate attributeName="cy" values="150;132;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="816" cy="74" r="1.5">
      <animate attributeName="cy" values="74;88;74" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="588" cy="88" r="1.3">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="848" cy="160" r="2.2">
      <animate attributeName="cy" values="160;144;160" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#ffca34" stroke-opacity="0.25" stroke-width="0.7">
    <line x1="680" y1="56" x2="742" y2="120"/>
    <line x1="742" y1="120" x2="618" y2="150"/>
    <line x1="680" y1="56" x2="816" y2="74"/>
  </g>

  <!-- kicker -->
  <circle cx="48" cy="53" r="3.5" fill="#7feb00">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="62" y="58" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="6" fill="#ffca34">GITHUB OVERVIEW — LIVE</text>

  <!-- name reveal -->
  <text x="44" y="118" font-size="46" font-weight="700" fill="#f2f2f2" letter-spacing="1" opacity="0">ARTEMIS JAY
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="44" y="166" font-size="46" font-weight="700" fill="none" stroke="#f2f2f2" stroke-width="1.2" letter-spacing="1" opacity="0">BERNABE
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.55s" fill="freeze"/>
  </text>

  <!-- underline sweep -->
  <rect x="48" y="182" height="3" width="0" fill="url(#uline)">
    <animate attributeName="width" from="0" to="430" dur="1.5s" begin="0.9s" fill="freeze"/>
  </rect>

  <!-- tagline -->
  <text x="48" y="214" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#999999" opacity="0">SQL and BI dashboards  →  machine learning  →  agentic AI operating systems
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- right stats rail -->
  <line x1="600" y1="56" x2="600" y2="176" stroke="#242424"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <g opacity="0"><text x="620" y="66" font-size="12" fill="#777777"><tspan fill="#ffca34" font-weight="700" font-size="15">100</tspan>  REPOSITORIES</text><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/></g>
    <g opacity="0"><text x="620" y="92" font-size="12" fill="#777777"><tspan fill="#ffca34" font-weight="700" font-size="15">89</tspan>  PUBLIC PROJECTS</text><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/></g>
    <g opacity="0"><text x="620" y="118" font-size="12" fill="#777777"><tspan fill="#ffca34" font-weight="700" font-size="15">479</tspan>  CONTRIBUTIONS / 12 MO</text><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/></g>
    <g opacity="0"><text x="620" y="144" font-size="12" fill="#777777"><tspan fill="#ffca34" font-weight="700" font-size="15">20</tspan>  STARS EARNED</text><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/></g>
    <g opacity="0"><text x="620" y="170" font-size="12" fill="#777777"><tspan fill="#ffca34" font-weight="700" font-size="15">05</tspan>  YEARS SHIPPING</text><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.6s" fill="freeze"/></g>
  </g>

  <!-- watermark -->
  <text x="880" y="34" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#2c2c2c">LOIS4801 · CA</text>
</svg>
